<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>奶娃博物馆 - 高端艺术典藏特展</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
</head>
<body>

  <!-- A. 高端艺术画廊开屏首页 (Splash Screen / Haute Art Gallery Intro) -->
  <section id="splash-screen" class="splash-screen splash-art-gallery">
    <!-- 高端展厅深邃黑曜光影与极细胶片微噪点 -->
    <div class="art-ambient-glow"></div>
    <div class="art-filmic-grain"></div>

    <!-- 标题聚焦微光晕与漂浮星尘装饰 -->
    <div class="splash-spotlight-halo" aria-hidden="true"></div>
    <div class="splash-stardust-field" aria-hidden="true">
      <span class="stardust stardust-1"></span>
      <span class="stardust stardust-2"></span>
      <span class="stardust stardust-3"></span>
      <span class="stardust stardust-4"></span>
      <span class="stardust stardust-5"></span>
    </div>

    <!-- 极简高定艺术画廊极细线框与古典角标饰件 (Haute Gallery Hairline Frame & Corner Ornaments) -->
    <div class="gallery-hairline-frame" aria-hidden="true">
      <span class="frame-corner corner-tl"></span>
      <span class="frame-corner corner-tr"></span>
      <span class="frame-corner corner-bl"></span>
      <span class="frame-corner corner-br"></span>
      <span class="frame-accent accent-top"></span>
      <span class="frame-accent accent-bottom"></span>
      <span class="frame-accent accent-left"></span>
      <span class="frame-accent accent-right"></span>
    </div>

    <div class="splash-content">
      <!-- 典藏艺术馆纯几何徽章图腾 (Haute Emblem / Pure Geometric Glyph) -->
      <div class="splash-emblem" aria-hidden="true">
        <svg class="emblem-svg" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="60" cy="60" r="54" stroke="currentColor" stroke-width="0.8" stroke-dasharray="3 5" class="emblem-orbit-outer" />
          <circle cx="60" cy="60" r="46" stroke="currentColor" stroke-width="0.9" opacity="0.65" />
          <circle cx="60" cy="60" r="37" stroke="currentColor" stroke-width="0.6" stroke-dasharray="2 4" opacity="0.45" />
          <path d="M60 10 L60 110 M10 60 L110 60" stroke="currentColor" stroke-width="0.8" opacity="0.6" />
          <path d="M25 25 L95 95 M25 95 L95 25" stroke="currentColor" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.35" />
          <polygon points="60,28 66,52 90,60 66,68 60,92 54,68 30,60 54,52" stroke="currentColor" stroke-width="1.1" fill="none" class="emblem-core-star" />
          <polygon points="60,39 64,55 80,60 64,65 60,81 56,65 40,60 56,55" stroke="currentColor" stroke-width="0.6" fill="currentColor" fill-opacity="0.14" />
          <circle cx="60" cy="20" r="1.5" fill="currentColor" />
          <circle cx="60" cy="100" r="1.5" fill="currentColor" />
          <circle cx="20" cy="60" r="1.5" fill="currentColor" />
          <circle cx="100" cy="60" r="1.5" fill="currentColor" />
          <circle cx="60" cy="60" r="2.8" fill="currentColor" class="emblem-center-gem" />
        </svg>
      </div>

      <!-- 标题上方微星芒与对称细金线 -->
      <div class="splash-ornament-upper" aria-hidden="true">
        <span class="ornament-line"></span>
        <span class="ornament-diamond"></span>
        <span class="ornament-line"></span>
      </div>
      
      <!-- 网站主标题：奶娃博物馆（仅保留这几个字） -->
      <h1 class="splash-title" id="splash-title">奶娃博物馆</h1>

      <!-- 标题下方古典对称双层几何饰件 (取代原先的文字副标与年份) -->
      <div class="splash-ornament-lower" aria-hidden="true">
        <div class="ornament-divider-row">
          <span class="ornament-dash"></span>
          <span class="ornament-rhombus-group">
            <i class="rhombus-sm"></i>
            <i class="rhombus-lg"></i>
            <i class="rhombus-sm"></i>
          </span>
          <span class="ornament-dash"></span>
        </div>
        <div class="ornament-sub-row">
          <span class="ornament-sub-dash"></span>
          <i class="ornament-sub-dot"></i>
          <span class="ornament-sub-dash"></span>
        </div>
      </div>
    </div>

    <!-- 底部滚动探索纯视觉微标（去除了所有文字，仅保留纯图形探索动效） -->
    <div class="splash-scroll-hint" id="splash-hint" title="向下滚动开启特展" aria-label="向下滚动开启特展">
      <div class="scroll-mouse-icon"></div>
      <div class="scroll-chevrons" aria-hidden="true">
        <span class="chevron-line chevron-1"></span>
        <span class="chevron-line chevron-2"></span>
      </div>
    </div>
  </section>

  <!-- B. 极简金芒视窗边框 (从底部中心向上方发散扩展) -->
  <div id="portal-frame" class="portal-frame"></div>

  <!-- C. 目标实际页面：主全屏画廊受控视窗 (由底部中心向上四周扩散铺满) -->
  <div id="main-gallery-portal" class="gallery-portal">

    <!-- 1. 全屏沉浸画布容器 (100vw x 100vh) -->
    <div class="fullscreen-canvas" id="fullscreen-canvas">
      <!-- 由 js/app.js 动态管理全屏背景层与双缓冲视差过渡 -->
    </div>

    <!-- 2. 界面悬浮交互骨架 -->
    <div class="lux-interface">
      <!-- 左上角菜单按钮 (移动端默认展示，用于展开/隐藏目录) -->
      <div class="lux-top-left-controls">
        <button class="lux-icon-btn btn-menu-toggle" id="btn-menu-toggle" title="展开/隐藏展品目录" aria-label="展开/隐藏展品目录">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- 右上角：展品总览网格 + 退出至开屏首页按钮 (极简轻奢徽钮) -->
      <div class="lux-top-controls">
        <button class="lux-icon-btn btn-grid-toggle" id="btn-grid-toggle" title="展开全部展品总览" aria-label="全部展品总览">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1"></rect>
            <rect x="14" y="3" width="7" height="7" rx="1"></rect>
            <rect x="3" y="14" width="7" height="7" rx="1"></rect>
            <rect x="14" y="14" width="7" height="7" rx="1"></rect>
          </svg>
        </button>
        <button class="lux-icon-btn btn-exit-splash" id="btn-exit-splash" title="退出特展返回首页" aria-label="返回首页">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="lux-body">
        <!-- 左侧大弧度纯标签目录 (移动端透明无背景无标题) -->
        <aside class="left-arc-container" id="left-arc-container">
          <!-- 极细弧线参考轨道 -->
          <svg class="arc-guide-path" viewBox="0 0 140 800" fill="none" preserveAspectRatio="none">
            <path d="M 46 55 Q 85 400 46 745" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.25"/>
          </svg>

          <div class="arc-stage-wrapper" id="arc-stage-wrapper">
            <div class="arc-track" id="arc-track">
              <!-- 纯标签项将由 ArcCarousel 动态计算坐标挂载 -->
            </div>
          </div>
        </aside>
      </div>
    </div>

  </div>

  <!-- D. 全部展品总览网格视图 (All-Works Grid Overview) -->
  <section id="grid-gallery" class="grid-gallery" aria-hidden="true">
    <div class="grid-gallery-inner">
      <header class="grid-gallery-header">
        <div class="grid-header-titles">
          <h2 class="grid-gallery-title">全部展品总览</h2>
          <p class="grid-gallery-sub" id="grid-gallery-count">共 0 幅典藏 · FROGS MUSEUM COLLECTION</p>
        </div>
        <button class="lux-icon-btn btn-grid-close" id="btn-grid-close" title="返回沉浸展厅" aria-label="返回沉浸展厅">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </header>
      <div class="grid-gallery-scroll" id="grid-gallery-scroll">
        <div class="grid-gallery-grid" id="grid-gallery-grid">
          <!-- 展品卡片由 js/app.js 动态生成 -->
        </div>
      </div>
    </div>
  </section>

  <!-- E. 背景音乐与全局开关 -->
  <audio id="bg-music" src="assets/人鱼的眼泪dj降调版.mp3" loop preload="auto"></audio>
  <button id="music-toggle" class="music-toggle-btn" title="开启 / 关闭背景音乐" aria-label="背景音乐开关" aria-pressed="false">
    <span class="music-icon" aria-hidden="true">
      <svg class="icon-music-off" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"></path>
        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="18" cy="16" r="3"></circle>
        <line x1="3" y1="3" x2="21" y2="21"></line>
      </svg>
      <svg class="icon-music-on" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"></path>
        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="18" cy="16" r="3"></circle>
      </svg>
    </span>
    <span class="music-label" id="music-label">音乐：关</span>
    <span class="music-eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  </button>

  <!-- 脚本加载 -->
  <script src="js/data.js"></script>
  <script src="js/arc-carousel.js"></script>
  <script src="js/app.js"></script>
  <script src="js/splash.js"></script>
</body>
</html>
